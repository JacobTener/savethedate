<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Save the Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero-card">
        <div class="invite-art">
          <a class="invite-home-link" href="../">Home</a>
          <img
            class="save-the-date-image"
            src="../save-the-date-lg.png"
            alt="Save the date invitation for Hannah Forrestal and Jacob Tener on Saturday, August 14th 2027 in Chicago, Illinois"
          />
        </div>

        <div class="actions actions-calendar">
          <a
            id="google-calendar-link"
            class="button button-primary"
            href="#"
            target="_blank"
            rel="noreferrer"
          >
            <svg
              class="button-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v11a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8ZM5 6a1 1 0 0 0-1 1v1h16V7a1 1 0 0 0-1-1h-1v1a1 1 0 1 1-2 0V6H8v1a1 1 0 1 1-2 0V6H5Z"
                fill="currentColor"
              />
            </svg>
            <span>Add to Google Calendar</span>
          </a>
          <a
            id="apple-calendar-link"
            class="button button-secondary"
            href="/save-the-date.ics"
          >
            <svg
              class="button-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v11a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8ZM5 6a1 1 0 0 0-1 1v1h16V7a1 1 0 0 0-1-1h-1v1a1 1 0 1 1-2 0V6H8v1a1 1 0 1 1-2 0V6H5Z"
                fill="currentColor"
              />
            </svg>
            <span>Add to Apple Calendar</span>
          </a>
        </div>

        <div class="address-cta">
          <p class="address-cta-kicker">Formal invitation to follow</p>
          <h2 class="address-cta-title">Please enter your mailing address</h2>
          <p class="address-cta-copy">
            We need your address to send your invitation. Tap below to look up
            your household and share where we should mail it.
          </p>
          <a class="button button-primary address-cta-button" href="../find-you/">
            Send us your address
          </a>
        </div>
      </section>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
